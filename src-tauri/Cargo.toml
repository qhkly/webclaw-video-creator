[package]
name = "webclaw-video-creator"
version = "0.1.0"
edition = "2021"

[lib]
name = "webclaw_video_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "fs", "sync", "time", "net"] }
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
